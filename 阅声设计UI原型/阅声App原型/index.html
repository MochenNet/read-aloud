<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阅声</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body id="page-index">
    <div class="container">
        <header>
            <h1 class="app-name">阅声</h1>
            <div class="date-display">
                <span class="day">29</span>
                <span class="month">七月</span>
            </div>
        </header>
        <main>
            <div class="card">
                <img src="https://placehold.co/600x400/a2d2ff/333333?text=阅声" alt="Header Image">
                <div class="card-content">
                    <h2>关于告别</h2>
                    <p>我们一生都在学着如何告别，却总是学不会。</p>
                    <div class="card-icon-actions">
                        <button class="favorite-btn"><i class="far fa-heart"></i></button>
                    </div>
                </div>
                <div class="player">
                    <button class="play-pause"><i class="fas fa-play"></i></button>
                    <div class="progress-container">
                        <div class="progress-bar">
                            <div class="progress"></div>
                        </div>
                        <div class="time-info">
                            <span class="current-time">0:00</span>
                            <span class="duration">0:00</span>
                        </div>
                    </div>
                    <a href="#" class="read-full-btn">阅读</a>
                </div>
            </div>
        </main>
        <footer>
            <nav>
                <a href="index.html" class="active"><i class="fas fa-home"></i><span>首页</span></a>
                <a href="me.html"><i class="far fa-user"></i><span>我的</span></a>
            </nav>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
