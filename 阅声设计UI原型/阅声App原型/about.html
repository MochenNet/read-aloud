    <div class="container">
        <header>
            <a href="me.html"><i class="fas fa-arrow-left"></i></a>
            <div class="title">
                <h1>关于阅声</h1>
            </div>
        </header>
        <main>
            <div class="about-content" style="padding: 20px; text-align: center;">
                <i class="fas fa-leaf" style="font-size: 48px; color: var(--accent-color); margin-bottom: 20px;"></i>
                <h2 style="font-weight: 500;">万物皆有声</h2>
                <p style="font-size: 16px; line-height: 1.8; color: var(--text-color-secondary); text-align: left;">
                    “阅声” 是一款致力于将文字与声音融合，创造沉浸式阅读体验的应用。
                    <br><br>
                    我们相信，每一段文字都有其独特的情感和节奏，如同每一段旋律都蕴含着一个故事。在这里，我们精心挑选触动心灵的文字，并为之匹配恰如其分的背景音乐，希望为您提供一个可以随时遁入的、宁静的精神角落。
                    <br><br>
                    愿您在“阅声”的世界里，找到片刻的安宁与感动。
                </p>
                <p style="font-size: 14px; color: var(--text-color-secondary); margin-top: 40px;">版本 1.0.0 (Prototype)</p>
            </div>
        </main>
    </div>
